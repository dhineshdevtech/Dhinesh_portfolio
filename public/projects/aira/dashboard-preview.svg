<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aira dashboard preview</title>
  <desc id="desc">Preview of the Aira Android dashboard with voice controls, readiness buttons, shortcut suggestions, and command history.</desc>
  <defs>
    <linearGradient id="bg" x1="195" y1="0" x2="195" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF7FF"/>
      <stop offset="1" stop-color="#D8EAF6"/>
    </linearGradient>
    <linearGradient id="button" x1="28" y1="254" x2="362" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1377E5"/>
      <stop offset="1" stop-color="#18B7A0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6C8197" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <rect x="10" y="10" width="370" height="824" rx="28" fill="url(#bg)"/>

  <g font-family="Inter, Roboto, Arial, sans-serif">
    <text x="28" y="66" fill="#0E1A2A" font-size="32" font-weight="800">Aira</text>
    <text x="28" y="88" fill="#42546A" font-size="14">AI-powered mobile control assistant</text>
    <rect x="293" y="42" width="69" height="36" rx="18" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="313" y="65" fill="#0E1A2A" font-size="13" font-weight="700">Ready</text>

    <g filter="url(#softShadow)">
      <rect x="20" y="108" width="350" height="238" rx="24" fill="#F9FBFE" stroke="#C6D7E5"/>
    </g>
    <text x="42" y="150" fill="#0E1A2A" font-size="22" font-weight="800">Ready</text>
    <text x="42" y="176" fill="#42546A" font-size="14">Turn on accessibility, then use the mic</text>
    <text x="42" y="194" fill="#42546A" font-size="14">to let Aira execute tasks.</text>
    <text x="42" y="230" fill="#6C8197" font-size="11" font-weight="800">LAST TRANSCRIPT</text>
    <text x="42" y="252" fill="#0E1A2A" font-size="14">No transcript yet. Tap the mic to try a command.</text>
    <rect x="42" y="274" width="306" height="58" rx="18" fill="url(#button)"/>
    <text x="151" y="310" fill="#FFFFFF" font-size="18" font-weight="800">Tap to Speak</text>

    <rect x="20" y="360" width="350" height="126" rx="22" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="396" fill="#0E1A2A" font-size="16" font-weight="800">System readiness</text>
    <rect x="42" y="416" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#C6D7E5"/>
    <rect x="147" y="416" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#C6D7E5"/>
    <rect x="252" y="416" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#C6D7E5"/>
    <text x="58" y="443" fill="#1377E5" font-size="12" font-weight="700">Accessibility</text>
    <text x="174" y="443" fill="#1377E5" font-size="12" font-weight="700">Overlay</text>
    <text x="285" y="443" fill="#1377E5" font-size="12" font-weight="700">Battery</text>

    <rect x="20" y="500" width="350" height="112" rx="22" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="536" fill="#0E1A2A" font-size="16" font-weight="800">Suggested shortcuts</text>
    <rect x="42" y="554" width="152" height="36" rx="18" fill="#EFF7FF" stroke="#C6D7E5"/>
    <text x="58" y="577" fill="#42546A" font-size="13">Open WhatsApp (3)</text>
    <rect x="206" y="554" width="112" height="36" rx="18" fill="#EFF7FF" stroke="#C6D7E5"/>
    <text x="222" y="577" fill="#42546A" font-size="13">Go home (2)</text>

    <text x="28" y="652" fill="#0E1A2A" font-size="16" font-weight="800">Recent commands</text>
    <rect x="20" y="670" width="350" height="62" rx="18" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="696" fill="#0E1A2A" font-size="14" font-weight="700">Open WhatsApp</text>
    <text x="42" y="716" fill="#42546A" font-size="12">COMPLETED - Opening WhatsApp.</text>
    <rect x="20" y="744" width="350" height="62" rx="18" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="770" fill="#0E1A2A" font-size="14" font-weight="700">Scroll down</text>
    <text x="42" y="790" fill="#42546A" font-size="12">COMPLETED - Scroll action completed.</text>
  </g>
</svg>
