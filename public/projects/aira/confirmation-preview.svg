<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aira confirmation flow preview</title>
  <desc id="desc">Preview of the Aira confirmation dialog shown before sensitive device actions.</desc>
  <defs>
    <linearGradient id="bg" x1="195" y1="0" x2="195" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF7FF"/>
      <stop offset="1" stop-color="#D8EAF6"/>
    </linearGradient>
    <filter id="dialogShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <rect x="10" y="10" width="370" height="824" rx="28" fill="url(#bg)"/>

  <g font-family="Inter, Roboto, Arial, sans-serif">
    <text x="28" y="66" fill="#0E1A2A" font-size="32" font-weight="800">Aira</text>
    <text x="28" y="88" fill="#42546A" font-size="14">AI-powered mobile control assistant</text>
    <rect x="235" y="42" width="127" height="36" rx="18" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="254" y="65" fill="#0E1A2A" font-size="13" font-weight="700">Confirmation</text>

    <rect x="20" y="108" width="350" height="238" rx="24" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="150" fill="#0E1A2A" font-size="22" font-weight="800">Awaiting confirmation</text>
    <text x="42" y="176" fill="#42546A" font-size="14">Send a WhatsApp message to Arun</text>
    <text x="42" y="230" fill="#6C8197" font-size="11" font-weight="800">LAST TRANSCRIPT</text>
    <text x="42" y="252" fill="#0E1A2A" font-size="14">Tell Arun I will be there in 10 minutes</text>
    <rect x="42" y="274" width="306" height="58" rx="18" fill="#1377E5"/>
    <text x="146" y="310" fill="#FFFFFF" font-size="18" font-weight="800">Stop Listening</text>

    <rect x="20" y="360" width="350" height="126" rx="22" fill="#F9FBFE" stroke="#C6D7E5"/>
    <text x="42" y="396" fill="#0E1A2A" font-size="16" font-weight="800">System readiness</text>
    <rect x="42" y="416" width="96" height="44" rx="12" fill="#E8F7F2" stroke="#9AD8C7"/>
    <rect x="147" y="416" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#C6D7E5"/>
    <rect x="252" y="416" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#C6D7E5"/>
    <text x="61" y="443" fill="#12735B" font-size="12" font-weight="700">Ready</text>
    <text x="174" y="443" fill="#1377E5" font-size="12" font-weight="700">Overlay</text>
    <text x="285" y="443" fill="#1377E5" font-size="12" font-weight="700">Battery</text>

    <rect x="10" y="10" width="370" height="824" rx="28" fill="#1E293B" opacity="0.22"/>

    <g filter="url(#dialogShadow)">
      <rect x="38" y="282" width="314" height="262" rx="26" fill="#FFFFFF"/>
    </g>
    <text x="64" y="330" fill="#0E1A2A" font-size="22" font-weight="800">Confirm action</text>
    <text x="64" y="368" fill="#0E1A2A" font-size="15" font-weight="700">Send a WhatsApp message to Arun</text>
    <text x="64" y="400" fill="#42546A" font-size="14">Messaging actions always require</text>
    <text x="64" y="420" fill="#42546A" font-size="14">confirmation before Aira sends or</text>
    <text x="64" y="440" fill="#42546A" font-size="14">types on your behalf.</text>
    <rect x="64" y="470" width="104" height="44" rx="14" fill="#FFFFFF" stroke="#C6D7E5"/>
    <text x="94" y="498" fill="#42546A" font-size="14" font-weight="800">Cancel</text>
    <rect x="188" y="470" width="112" height="44" rx="14" fill="#1377E5"/>
    <text x="219" y="498" fill="#FFFFFF" font-size="14" font-weight="800">Confirm</text>
  </g>
</svg>
