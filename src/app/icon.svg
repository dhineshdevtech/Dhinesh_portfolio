<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Ice Mist Blue Frosted Background Gradient -->
    <linearGradient id="ice-mist-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f7fe" />
      <stop offset="50%" stop-color="#edf4fd" />
      <stop offset="100%" stop-color="#e2eefb" />
    </linearGradient>

    <!-- Glowing Cyan Dot Gradient & Filter -->
    <linearGradient id="cyan-dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="rim-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cde0f8" />
      <stop offset="100%" stop-color="#b6d4f6" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle (Ice Mist Blue) -->
  <rect width="32" height="32" rx="8" fill="url(#ice-mist-bg)" />
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" fill="none" stroke="url(#rim-border)" stroke-width="1" />

  <!-- Bold Deep Slate D -->
  <text
    x="12.5"
    y="22.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="19"
    font-weight="900"
    fill="#09172c"
    letter-spacing="-0.5"
  >D</text>

  <!-- Signature Glowing Cyan Dot (Deloitte Style) -->
  <circle cx="23.5" cy="20.5" r="2.8" fill="url(#cyan-dot-grad)" filter="url(#dot-glow)" />
  <circle cx="23.5" cy="20.5" r="2" fill="#ffffff" opacity="0.7" />
</svg>
