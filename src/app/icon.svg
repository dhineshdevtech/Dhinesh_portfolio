<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Vibrant Electric Cobalt Gradient -->
    <linearGradient id="cobalt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="highlight-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="url(#cobalt-bg)" />
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" fill="none" stroke="url(#highlight-border)" stroke-width="1" />

  <!-- Ice White Monogram D -->
  <text
    x="16"
    y="22.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="20"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-0.5"
  >D</text>
</svg>
