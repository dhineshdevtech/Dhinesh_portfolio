<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep Obsidian Slate Background Gradient -->
    <linearGradient id="slate-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <!-- Glowing Cyan Dot Gradient & Filter -->
    <linearGradient id="cyan-dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="rim-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="url(#slate-bg)" />
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" fill="none" stroke="url(#rim-border)" stroke-width="1" />

  <!-- Bold Ice White D -->
  <text
    x="12.5"
    y="22.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="19"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-0.5"
  >D</text>

  <!-- Signature Glowing Cyan Dot (Deloitte Style) -->
  <circle cx="23.5" cy="20.5" r="2.8" fill="url(#cyan-dot-grad)" filter="url(#dot-glow)" />
  <circle cx="23.5" cy="20.5" r="2" fill="#ffffff" opacity="0.6" />
</svg>
